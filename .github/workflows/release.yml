name: release
# Publish RepoMarshal to PyPI with trusted publishing (OIDC): no API token exists anywhere.
#
# Triggered only by pushing a tag `v<version>`. The build job refuses unless all of these hold:
#   - the tag is an ANNOTATED tag whose signature GitHub reports as verified (sign it with
#     `git tag -s`, using a GPG or SSH key registered on your GitHub account);
#   - the tag points at exactly the commit this run checked out (GITHUB_SHA);
#   - that commit is on the default branch;
#   - the tag name, pyproject.toml's version and repomarshal.__version__ agree.
# It builds from that commit only, with pinned build tools, and hands the files to a separate
# publish job. Only the publish job can mint the PyPI OIDC token, and it runs in the protected
# environment `pypi`. It checks out nothing and runs no repository code.
# Setup: docs/guides/release.md.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: verify the signed tag
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # Comma-separated tagger emails allowed to release (repository variable). GitHub marks
          # a tag verified only when the signing key belongs to an account with that verified
          # email, so this pins WHO released, not just "someone signed" (v0.6 review F9).
          ALLOWED_TAGGERS: ${{ vars.RELEASE_TAGGER_EMAILS }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag '$TAG' is not v<major>.<minor>.<patch>"; exit 1
          fi
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [ "$(printf '%s' "$ref" | jq -r .object.type)" != "tag" ]; then
            echo "'$TAG' is a lightweight tag; create a signed annotated tag (git tag -s)"; exit 1
          fi
          tag_sha=$(printf '%s' "$ref" | jq -r .object.sha)
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
          verified=$(printf '%s' "$tag" | jq -r .verification.verified)
          reason=$(printf '%s' "$tag" | jq -r .verification.reason)
          target_type=$(printf '%s' "$tag" | jq -r .object.type)
          target=$(printf '%s' "$tag" | jq -r .object.sha)
          if [ "$verified" != "true" ]; then
            echo "tag '$TAG' signature is not verified by GitHub (reason: $reason)"; exit 1
          fi
          tagger=$(printf '%s' "$tag" | jq -r '.tagger.email // ""')
          if [ -z "$ALLOWED_TAGGERS" ]; then
            echo "repository variable RELEASE_TAGGER_EMAILS is not set; refusing to release"; exit 1
          fi
          allowed=no
          IFS=',' read -ra emails <<< "$ALLOWED_TAGGERS"
          for e in "${emails[@]}"; do
            [ -n "$tagger" ] && [ "$(echo "$e" | xargs)" = "$tagger" ] && allowed=yes
          done
          if [ "$allowed" != yes ]; then
            echo "tagger '$tagger' is not in RELEASE_TAGGER_EMAILS"; exit 1
          fi
          if [ "$target_type" != "commit" ] || [ "$target" != "$GITHUB_SHA" ]; then
            echo "tag '$TAG' points at $target_type $target, not the checked-out $GITHUB_SHA"; exit 1
          fi
          echo "tag $TAG: signature verified, commit $target"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: the commit is on the default branch and the versions agree
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The full ref: a TAG named origin/<branch> would win over the remote-tracking branch
          # with the short name (v0.6 review F8).
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" || {
            echo "$GITHUB_SHA is not on $DEFAULT_BRANCH"; exit 1; }
          want="${TAG#v}"
          py=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          init=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/repomarshal/__init__.py)
          if [ "$py" != "$want" ] || [ "$init" != "$want" ]; then
            echo "version mismatch: tag $want, pyproject $py, __version__ $init"; exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: build the sdist and wheel
        run: |
          python -I -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -I -m pip install --quiet "build==1.2.2.post1"
          "$RUNNER_TEMP/build-venv/bin/python" -I -m build --outdir dist .
          ls -l dist
          want="${GITHUB_REF_NAME#v}"
          test "$(ls dist | wc -l)" -eq 2
          test -f "dist/repomarshal-$want.tar.gz"
          test -f "dist/repomarshal-$want-py3-none-any.whl"
          sha256sum dist/*
      - name: smoke-test the wheel
        run: |
          python -I -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -I -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/smoke/bin/repomarshal" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/repomarshal/
    permissions:
      id-token: write # trusted publishing: the only credential, minted for this job only
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: exactly the two release files
        # Build hooks run repository code in the build job; whatever they produced, only the
        # sdist and wheel of this version are uploaded.
        run: |
          want="${GITHUB_REF_NAME#v}"
          ls -la dist
          test "$(find dist -mindepth 1 | wc -l)" -eq 2
          test -f "dist/repomarshal-$want.tar.gz" && test ! -L "dist/repomarshal-$want.tar.gz"
          test -f "dist/repomarshal-$want-py3-none-any.whl"
          test ! -L "dist/repomarshal-$want-py3-none-any.whl"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true
