name: ci
on:
  push:
    # Only main: on a PR branch, a push run would add a SKIPPED `dogfood` check (skipped counts
    # as success) on the same commit as the PR run's real verdict, and a required `dogfood`
    # check could be satisfied by the skipped one.
    branches: [main]
  pull_request:
    # labeled/unlabeled: a `repomarshal-waive:<target>` label change re-runs the dogfood verdict.
    # (v0.4: reviews no longer grant waivers, so review events no longer trigger a run. Post the
    # reason comment BEFORE applying the label: a comment alone does not re-run the workflow.)
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Git identity for fixture commits
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Test
        run: python -m pytest -o addopts="" -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests

  mcp:
    # The optional repomarshal[mcp] extra: the main test job runs without the SDK (its MCP tests
    # skip), so this job installs the extra and runs the server tests for real.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: MCP server tests
        run: python -m pytest -o addopts="" -q tests/unit/test_mcp_server.py tests/unit/test_contract.py

  # Dogfood: the authoritative verdict for this repository's PRs, judged by RepoMarshal from BASE
  # (v0.4, threat T26). Three stages, so that the PR's code never runs where the judge reads
  # policy, waivers or results:
  #   rm-plan   judge only: plan, PR-head binding, gate matrix. No PR code runs.
  #   rm-gate-N one fresh job per gate that runs PR code, with NO token permissions.
  #   dogfood   judge only, on a fresh runner: re-plan, re-read waivers, bind each gate result to
  #             GitHub's own record of its job (Actions API), fold. No PR code runs.
  # While BASE's judge predates `repomarshal ci` (v0.3), dogfood falls back to the single-job
  # `repomarshal done`, which runs the gates itself.
  rm-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # waivers: labels, comments
      issues: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      ok: ${{ steps.plan.outputs.ok }}
      expect: ${{ steps.plan.outputs.expect }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # the same commit in every job of the run
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the judge (RepoMarshal) from the PR's BASE commit
        # Before any PR-controlled code runs: install RepoMarshal from BASE, outside the
        # workspace, so the PR cannot change the code that judges it (v0.3 review).
        # Never from the PR checkout: `python -m X` there would import a PR file named X
        # (v0.4 review). -I keeps the cwd off sys.path; the step also runs outside the checkout.
        working-directory: ${{ runner.temp }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/rm-base"
          git -C "$GITHUB_WORKSPACE" archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/rm-base"
          python -I -m venv "$RUNNER_TEMP/rm-venv"
          "$RUNNER_TEMP/rm-venv/bin/python" -I -m pip install --quiet "$RUNNER_TEMP/rm-base"
      - name: Install the gate tools (ruff, pytest) from BASE's dev requirements
        # Not `pip install -e .`, which would run the PR's build code. Every job installs the same
        # tools: tool availability is part of the plan, and the plans must match.
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/rm-venv/bin/python" -I - "$RUNNER_TEMP/rm-base/pyproject.toml" \
            > "$RUNNER_TEMP/dev-requirements.txt" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as f:
              print("\n".join(tomllib.load(f)["project"]["optional-dependencies"]["dev"]))
          PY
          python -I -m pip install --quiet -r "$RUNNER_TEMP/dev-requirements.txt"
      - name: Git identity for fixture commits
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RM="$RUNNER_TEMP/rm-venv/bin/repomarshal"
          if "$RM" ci --help > /dev/null 2>&1; then
            echo "mode=split" >> "$GITHUB_OUTPUT"
            "$RM" ci plan --base "$BASE_SHA" --github-output
          else
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "BASE's judge has no 'ci' command (pre-v0.4): dogfood runs the single-job verdict."
          fi

  rm-gate:
    needs: rm-plan
    if: needs.rm-plan.outputs.mode == 'split' && needs.rm-plan.outputs.count != '0'
    name: rm-gate-${{ matrix.index }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {} # the PR's code runs here: no token scopes at all
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.rm-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # the same commit in every job of the run
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the judge (RepoMarshal) from the PR's BASE commit
        # Before any PR-controlled code runs: install RepoMarshal from BASE, outside the
        # workspace, so the PR cannot change the code that judges it (v0.3 review).
        # Never from the PR checkout: `python -m X` there would import a PR file named X
        # (v0.4 review). -I keeps the cwd off sys.path; the step also runs outside the checkout.
        working-directory: ${{ runner.temp }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/rm-base"
          git -C "$GITHUB_WORKSPACE" archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/rm-base"
          python -I -m venv "$RUNNER_TEMP/rm-venv"
          "$RUNNER_TEMP/rm-venv/bin/python" -I -m pip install --quiet "$RUNNER_TEMP/rm-base"
      - name: Install the gate tools (ruff, pytest) from BASE's dev requirements
        # Not `pip install -e .`, which would run the PR's build code. Every job installs the same
        # tools: tool availability is part of the plan, and the plans must match.
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/rm-venv/bin/python" -I - "$RUNNER_TEMP/rm-base/pyproject.toml" \
            > "$RUNNER_TEMP/dev-requirements.txt" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as f:
              print("\n".join(tomllib.load(f)["project"]["optional-dependencies"]["dev"]))
          PY
          python -I -m pip install --quiet -r "$RUNNER_TEMP/dev-requirements.txt"
      - name: Git identity for fixture commits
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      # The names and outcomes of the next two steps are the binding contract: the dogfood job
      # reads their conclusions through the Actions API, where PR code in another job cannot
      # change them. "run gate" fails exactly when the gate FAILed; "gate passed" succeeds
      # exactly when it PASSed. Anything else is UNKNOWN.
      - name: run gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RM_EXPECT: ${{ needs.rm-plan.outputs.expect }}
          RM_GATE: ${{ matrix.gate }}
        run: |
          code=0
          "$RUNNER_TEMP/rm-venv/bin/repomarshal" ci gate --base "$BASE_SHA" --gate "$RM_GATE" \
            --expect "$RM_EXPECT" --out "$RUNNER_TEMP/rm-result/result.json" || code=$?
          echo "repomarshal ci gate exit code: $code (0 PASS, 1 FAIL, 2 other)"
          if [ "$code" -eq 1 ]; then exit 1; fi
      - name: gate passed
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/rm-venv/bin/repomarshal" ci passed --result "$RUNNER_TEMP/rm-result/result.json"
      - name: upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rm-gate-${{ matrix.index }}
          path: ${{ runner.temp }}/rm-result/result.json
          if-no-files-found: error
          retention-days: 30

  dogfood:
    needs: [rm-plan, rm-gate]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # waivers: labels, comments
      issues: read
      actions: read # GitHub's record of the rm-gate jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # the same commit in every job of the run
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the judge (RepoMarshal) from the PR's BASE commit
        # Before any PR-controlled code runs: install RepoMarshal from BASE, outside the
        # workspace, so the PR cannot change the code that judges it (v0.3 review).
        # Never from the PR checkout: `python -m X` there would import a PR file named X
        # (v0.4 review). -I keeps the cwd off sys.path; the step also runs outside the checkout.
        working-directory: ${{ runner.temp }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/rm-base"
          git -C "$GITHUB_WORKSPACE" archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/rm-base"
          python -I -m venv "$RUNNER_TEMP/rm-venv"
          "$RUNNER_TEMP/rm-venv/bin/python" -I -m pip install --quiet "$RUNNER_TEMP/rm-base"
      - name: Install the gate tools (ruff, pytest) from BASE's dev requirements
        # Not `pip install -e .`, which would run the PR's build code. Every job installs the same
        # tools: tool availability is part of the plan, and the plans must match.
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/rm-venv/bin/python" -I - "$RUNNER_TEMP/rm-base/pyproject.toml" \
            > "$RUNNER_TEMP/dev-requirements.txt" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as f:
              print("\n".join(tomllib.load(f)["project"]["optional-dependencies"]["dev"]))
          PY
          python -I -m pip install --quiet -r "$RUNNER_TEMP/dev-requirements.txt"
      - name: Git identity for fixture commits
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Download the gate results
        if: needs.rm-plan.outputs.mode == 'split' && needs.rm-plan.outputs.count != '0'
        continue-on-error: true # a missing result is reported as UNKNOWN by the judge
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: rm-gate-*
          path: ${{ runner.temp }}/rm-results
      - name: repomarshal verdict
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RM_EXPECT: ${{ needs.rm-plan.outputs.expect }}
        run: |
          RM="$RUNNER_TEMP/rm-venv/bin/repomarshal"
          mkdir -p "$RUNNER_TEMP/rm-results"
          set +e
          if "$RM" ci --help > /dev/null 2>&1; then
            "$RM" ci verdict --base "$BASE_SHA" --expect "$RM_EXPECT" \
              --results "$RUNNER_TEMP/rm-results" --json > repomarshal-done.json
          else
            # Legacy (BASE judge before v0.4): one job runs the gates and judges.
            WAIVERS=""
            if "$RM" done --help | grep -q -- "--waivers"; then WAIVERS="--waivers github"; fi
            # shellcheck disable=SC2086
            "$RM" done --base "$BASE_SHA" $WAIVERS --json > repomarshal-done.json
          fi
          code=$?
          set -e
          cat repomarshal-done.json
          echo "repomarshal exit code: $code (0 PASS, 1 FAIL, 2 UNKNOWN, 3 BLOCKED, 4 error)"
          exit "$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repomarshal-evidence
          path: |
            repomarshal-done.json
            .repomarshal/evidence/
          if-no-files-found: warn
          retention-days: 30
