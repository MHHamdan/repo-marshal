name: ci
on:
  push:
  pull_request:
    # labeled/unlabeled: a `repomarshal-waive:<target>` label change re-runs the dogfood verdict.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    # A CODEOWNER approval can carry waivers; a dismissal must re-run the verdict to revoke them.
    # These events re-run every job, not only dogfood. That is deliberate: a job skipped by an
    # `if:` reports success, and a skipped `test` from a review-triggered run would stand in for
    # a failed or cancelled `test` from the pull_request run on the same commit.
    types: [submitted, dismissed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Git identity for fixture commits
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: Test
        run: python -m pytest -o addopts="" -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests

  mcp:
    # The optional repomarshal[mcp] extra: the main test job runs without the SDK (its MCP tests
    # skip), so this job installs the extra and runs the server tests for real.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: MCP server tests
        run: python -m pytest -o addopts="" -q tests/unit/test_mcp_server.py tests/unit/test_contract.py

  dogfood:
    # The authoritative verdict: re-run `repomarshal done` where the coding agent cannot write.
    # No secrets are used here: the gates execute the PR's own code. The workflow token is
    # read-only (it lets `--waivers github` read labels, comments and reviews; see
    # docs/guides/waivers.md) and the gates can see it, so it must never gain write scopes.
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the judge (RepoMarshal) from the PR's BASE commit
        # The PR must not be able to change the code that judges it (or that decides which
        # waivers are genuine): install RepoMarshal from BASE, outside the workspace. This runs
        # before ANY PR-controlled code: a PR build backend run earlier (`pip install -e .`) could
        # plant `git replace` refs or git config that rewrite what BASE looks like (v0.3 review).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/rm-base"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/rm-base"
          python -m venv "$RUNNER_TEMP/rm-venv"
          "$RUNNER_TEMP/rm-venv/bin/python" -m pip install --quiet "$RUNNER_TEMP/rm-base"
      - name: Install the tools the gates need (ruff, pytest) from BASE's dev extra
        # Not `pip install -e .` from the PR: that runs the PR's build code before the judge reads
        # BASE policy and waivers. The tests import the PR's code from src/ (pytest pythonpath),
        # so only third-party tools come from here; PR code first runs inside the gates, after
        # the judge has read everything it trusts.
        run: |
          "$RUNNER_TEMP/rm-venv/bin/python" - "$RUNNER_TEMP/rm-base/pyproject.toml" \
            > "$RUNNER_TEMP/dev-requirements.txt" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as f:
              print("\n".join(tomllib.load(f)["project"]["optional-dependencies"]["dev"]))
          PY
          python -m pip install --quiet -r "$RUNNER_TEMP/dev-requirements.txt"
      - name: Git identity for fixture commits
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: repomarshal done
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RM="$RUNNER_TEMP/rm-venv/bin/repomarshal"
          WAIVERS=""
          if "$RM" done --help | grep -q -- "--waivers"; then WAIVERS="--waivers github"; fi
          set +e
          # shellcheck disable=SC2086
          "$RM" done --base "$BASE_SHA" $WAIVERS --json > repomarshal-done.json
          code=$?
          set -e
          cat repomarshal-done.json
          echo "repomarshal done exit code: $code (0 PASS, 1 FAIL, 2 UNKNOWN, 3 BLOCKED, 4 error)"
          exit "$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repomarshal-evidence
          path: |
            repomarshal-done.json
            .repomarshal/evidence/
          if-no-files-found: warn
          retention-days: 30
